  <div id="progressBar">

  <div class="nav-fixed" id="navbar">
    <div class="nav-component">
      <div class="nav-container" id="navContainer">

        <a href="index.html" class="nav-brand">
          <img src="logo.png" alt="Team Logo" class="nav-logo">
          <span class="nav-title"></span>
        </a>

        <div class="nav-menu-wrapper" id="navMenu">

          <a href="#" class="nav-link">Home</a>

          <div class="nav-dropdown">
            <button class="nav-dropdown-toggle">
              Project
              <svg class="nav-dropdown-arrow" viewBox="0 0 10 10">
                <path d="M1 3l4 4 4-4" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
            <div class="nav-dropdown-menu">
              <a href="#" class="nav-dropdown-link">Description</a>
              <a href="#" class="nav-dropdown-link">Contribution</a>
              <a href="#" class="nav-dropdown-link">Safety</a>
            </div>
          </div>

          <div class="nav-dropdown">
            <button class="nav-dropdown-toggle">
              Lab
              <svg class="nav-dropdown-arrow" viewBox="0 0 10 10">
                <path d="M1 3l4 4 4-4" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
            <div class="nav-dropdown-menu">
              <a href="#" class="nav-dropdown-link">Engineering</a>
              <a href="#" class="nav-dropdown-link">Modelling</a>
              <a href="#" class="nav-dropdown-link">Parts</a>
              <a href="#" class="nav-dropdown-link">Results</a>
            </div>
          </div>

          <div class="nav-dropdown">
            <button class="nav-dropdown-toggle">
              IHP
              <svg class="nav-dropdown-arrow" viewBox="0 0 10 10">
                <path d="M1 3l4 4 4-4" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
            <div class="nav-dropdown-menu">
              <a href="#" class="nav-dropdown-link">IHP</a>
              <a href="#" class="nav-dropdown-link">Education</a>
              <a href="#" class="nav-dropdown-link">Software</a>
            </div>
          </div>

          <div class="nav-dropdown">
            <button class="nav-dropdown-toggle">
              Team
              <svg class="nav-dropdown-arrow" viewBox="0 0 10 10">
                <path d="M1 3l4 4 4-4" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
            <div class="nav-dropdown-menu">
              <a href="members.html" class="nav-dropdown-link">Members</a>
              <a href="#" class="nav-dropdown-link">Attribution</a>
            </div>
          </div>
        </div>

        <button class="nav-hamburger" id="navHamburger" aria-label="Toggle menu">
          <span class="nav-hamburger-line"></span>
          <span class="nav-hamburger-line"></span>
          <span class="nav-hamburger-line"></span>
        </button>
      </div>
    </div>
  </div>

  <script src="theme.js"></script>
  <script>
    document.querySelector('.nav-title').textContent = window.APP_TITLE;

    (function () {
      var bar     = document.getElementById('progressBar');
      var icon    = document.getElementById('progressIcon');
      var ticking = false;

      var frames   = window.PROGRESS_ICONS || [];
      var step     = window.PROGRESS_STEP || 170;
      var advances = window.PROGRESS_ADVANCES || 0;

      frames.forEach(function (src) {
        var img = new Image();
        img.src = src;
      });

      if (frames.length) {
        icon.src = frames[0];
        icon.dataset.idx = '0';
      }

      function updateWidth() {
        var scrollTop = window.scrollY;
        var docHeight = document.documentElement.scrollHeight - window.innerHeight;
        var pct = docHeight > 0 ? (scrollTop / docHeight) * 100 : 0;
        bar.style.width = Math.min(pct, 100) + '%';

        if (frames.length) {
          var stepCount = advances > 0 && docHeight > 0
            ? Math.floor((scrollTop / docHeight) * advances)
            : Math.floor(scrollTop / step);
          var idx = stepCount % frames.length;
          if (icon.dataset.idx !== String(idx)) {
            icon.src = frames[idx];
            icon.dataset.idx = String(idx);
          }
        }

        ticking = false;
      }

      function onScroll() {
        if (!ticking) {
          window.requestAnimationFrame(updateWidth);
          ticking = true;
        }
      }

      updateWidth();
      window.addEventListener('scroll', onScroll, { passive: true });
    })();

    (function () {
      var hamburger = document.getElementById('navHamburger');
      var menu = document.getElementById('navMenu');
      var container = document.getElementById('navContainer');

      hamburger.addEventListener('click', function () {
        var isOpen = menu.classList.toggle('show');
        container.classList.toggle('menu-open', isOpen);
      });
    })();

    (function () {
      document.querySelectorAll('.nav-dropdown').forEach(function (dd) {
        var toggle = dd.querySelector('.nav-dropdown-toggle');
        toggle.addEventListener('click', function (e) {
          if (window.innerWidth <= 991) {
            e.preventDefault();
            dd.classList.toggle('open');
          }
        });
      });
    })();
  </script>

</body>
</html>
