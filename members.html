  <main class="cards-page">
    <div class="cards-page-header">
      <h1>Team Members</h1>
      <p>Click a card to flip it over</p>
    </div>
    <div class="cards-grid" id="cardsGrid"></div>
  </main>

  <script src="theme.js"></script>
  <script>
    document.querySelector('.nav-title').textContent = window.APP_TITLE;

    /* ── progress bar ── */
    (function () {
      var bar     = document.getElementById('progressBar');
      var icon    = document.getElementById('progressIcon');
      var ticking = false;
      var frames  = window.PROGRESS_ICONS || [];
      var step    = window.PROGRESS_STEP || 170;

      frames.forEach(function (src) { var img = new Image(); img.src = src; });
      if (frames.length) { icon.src = frames[0]; icon.dataset.idx = '0'; }

      function update() {
        var scrollTop = window.scrollY;
        var docHeight = document.documentElement.scrollHeight - window.innerHeight;
        var pct = docHeight > 0 ? (scrollTop / docHeight) * 100 : 0;
        bar.style.width = Math.min(pct, 100) + '%';
        if (frames.length) {
          var idx = Math.floor(scrollTop / step) % frames.length;
          if (icon.dataset.idx !== String(idx)) { icon.src = frames[idx]; icon.dataset.idx = String(idx); }
        }
        ticking = false;
      }
      function onScroll() { if (!ticking) { window.requestAnimationFrame(update); ticking = true; } }
      update();
      window.addEventListener('scroll', onScroll, { passive: true });
    })();

    /* ── mobile hamburger ── */
    (function () {
      var hamburger = document.getElementById('navHamburger');
      var menu = document.getElementById('navMenu');
      var container = document.getElementById('navContainer');
      hamburger.addEventListener('click', function () {
        var isOpen = menu.classList.toggle('show');
        container.classList.toggle('menu-open', isOpen);
      });
    })();

    /* ── mobile dropdown accordion ── */
    (function () {
      document.querySelectorAll('.nav-dropdown').forEach(function (dd) {
        dd.querySelector('.nav-dropdown-toggle').addEventListener('click', function (e) {
          if (window.innerWidth <= 991) { e.preventDefault(); dd.classList.toggle('open'); }
        });
      });
    })();
  </script>

  <script>
    /* ── generate 20 member cards ── */
    var roles = ['Team Lead','Researcher','Designer','Lab Tech','Developer','Bioengineer','Analyst','Coordinator','Writer','Strategist'];
    var grid = document.getElementById('cardsGrid');

    for (var i = 1; i <= 20; i++) {
      var card = document.createElement('div');
      card.className = 'pokecard';
      card.innerHTML =
        '<div class="pokecard-inner">' +
          '<div class="pokecard-back">' +
            '<div class="pokeball-top"></div>' +
            '<div class="pokeball-band"></div>' +
            '<div class="pokeball-circle"></div>' +
            '<div class="pokeball-dots"></div>' +
          '</div>' +
          '<div class="pokecard-front">' +
            '<div class="card-avatar" style="background:hsl('+ (i * 18) +',65%,55%)">' +
              '<span>M'+ i +'</span>' +
            '</div>' +
            '<div class="card-name">Member '+ i +'</div>' +
            '<div class="card-role">'+ roles[(i-1) % roles.length] +'</div>' +
            '<div class="card-tagline">Lorem ipsum dolor sit amet</div>' +
          '</div>' +
        '</div>';
      grid.appendChild(card);
    }

    /* ── 3D tilt on cursor position (desktop only) ── */
    var hasHover = window.matchMedia('(hover: hover)').matches;

    document.querySelectorAll('.pokecard').forEach(function (card) {
      if (hasHover) {
        card.addEventListener('mousemove', function (e) {
          var rect = this.getBoundingClientRect();
          var x = e.clientX - rect.left - rect.width / 2;
          var y = e.clientY - rect.top - rect.height / 2;
          var rX = (y / rect.height) * -22;
          var rY = (x / rect.width) * 22;
          this.style.transform = 'perspective(800px) rotateX('+ rX +'deg) rotateY('+ rY +'deg) scale(1.03)';
        });

        card.addEventListener('mouseleave', function () {
          this.style.transform = 'perspective(800px) rotateX(0) rotateY(0) scale(1)';
        });
      }

      card.addEventListener('click', function () {
        this.classList.toggle('flipped');
      });
    });
  </script>

</body>
</html>
